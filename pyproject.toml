[project]
name = "ai-security-lab"
version = "0.1.0"
description = "Intentionally-vulnerable LLM agent and the guardrails that defend it — OWASP LLM Top 10, free and local via Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "ollama>=0.3.3",
  "llm-guard>=0.3.15",
]

[project.scripts]
ai-sec-agent = "ai_security_lab.cli:main"

[project.optional-dependencies]
attack = [
  "garak>=0.10.0",
]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
  "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_security_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
